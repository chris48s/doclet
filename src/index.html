<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doclet</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <h1 id="title">Doclet</h1>
    <p>Not a full docs site. Just a lil doclet.</p>
    <p>
      Paste a URL to a javascript file containing JSDoc comments. Generate HTML
      documentation.
    </p>
    <form method="get" action="jsdoc/">
      <label for="url">URL</label>
      <input type="text" id="url" name="url" size="56" />
      <label for="md">Parse markdown in comments</label>
      <input type="checkbox" id="md" name="md" value="true" checked />
      <input type="submit" value="Try it out" />
    </form>
  </body>
</html>
