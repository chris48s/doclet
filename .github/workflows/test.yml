name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node JS ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Show Node/NPM versions
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: |
          npm run prettier:check
          npm run lint

      - name: Build
        run: npm run build
