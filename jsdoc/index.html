<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doclet</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; }
      pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
      #error { color: #b00020; }
      .block { border-bottom: 1px solid #ddd; padding: 1rem 0; }
      .signature { font-size: 1.2rem; margin: 0 0 0.5rem; }
      .kind { color: #666; font-weight: normal; }
      .tags { list-style: none; padding: 0; }
      .tag { margin: 0.5rem 0; }
      .tag-name { font-weight: bold; }
      .tag-optional, .tag-default { color: #666; font-size: 0.9em; }
      .tag-description { margin-left: 1rem; }
      .problems { color: #b00020; }
    </style>
  </head>
  <body>
    <h1 id="title">Doclet</h1>
    <p id="source"></p>
    <p id="status">Loading…</p>
    <p id="error" role="alert" hidden></p>
    <div id="output" hidden></div>
    <script type="module" src="docs.js"></script>
  </body>
</html>
